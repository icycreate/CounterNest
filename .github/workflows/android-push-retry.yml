name: Android push retry
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
concurrency:
  group: android-push-retry
  cancel-in-progress: false
jobs:
  drain:
    if: vars.ANDROID_PUSH_RETRY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke restricted dispatch worker
        env:
          WORKER_KEY: ${{ secrets.ANDROID_PUSH_WORKER_KEY }}
        run: |
          test -n "$WORKER_KEY"
          curl --silent --show-error --fail --max-time 100 \
            --request POST \
            --header "Authorization: Bearer $WORKER_KEY" \
            https://onfhqlsovqkwrmjuuauy.supabase.co/functions/v1/android-push
