<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8b451f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CounterNest POS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Select the public tenant manifest before the browser considers installation.
      // Browser-tab favicons always retain the CounterNest identity below.
      if (/^\/catalogue(?:-display)?\/?$/.test(location.pathname)) {
        const catalogueToken = new URLSearchParams(location.search).get('token');
        const catalogueManifest = document.querySelector('link[rel="manifest"]');
        if (catalogueToken && /^[a-zA-Z0-9_-]{32,128}$/.test(catalogueToken)) {
          catalogueManifest.href = '/api/catalogue-manifest?' + new URLSearchParams({token:catalogueToken});
        } else catalogueManifest.remove();
      }
    </script>
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/pwa/favicon-64.png" />
    <title>CounterNest POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
