project_id = "counternest-web"

# Each handler validates the user JWT with auth.getUser and checks staff/shop authorization.
# Gateway verification is disabled to support current Auth signing keys.
[functions.create-staff-account]
verify_jwt = false

[functions.change-initial-password]
verify_jwt = false

[functions.change-password]
verify_jwt = false

[functions.reset-staff-password]
verify_jwt = false

[functions.workspace-lifecycle]
verify_jwt = false

# Handler validates internal secret; gateway JWT is not an API-key check.
[functions.send-preorder-email]
verify_jwt = false
# Public catalogue capability is validated in the database, not by a shared anon key.
[functions.submit-preorder]
verify_jwt = false
# Handler authenticates user JWT and checks the existing admin settings RPC.
[functions.preorder-email-admin]
verify_jwt = false
